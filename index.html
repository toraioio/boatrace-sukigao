<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ボートレーサー 好き顔9選</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>

<body>
<main>

<header>
  <div class="eyebrow">BOAT RACE</div>
  <h1>好き顔9選</h1>
  <p>9人の中から、好きな顔を何人でも選んでね！</p>
</header>

<section id="setup" class="panel">
  <h2>好き顔を探そう</h2>

  <p class="note">
    9人の中から好きな選手を何人でもタップ。<br>
    10回くり返して、選んだ回数が多い順にTOP9を作ります。
  </p>

  <button id="start" class="primary wide">
    スタート
  </button>
</section>

<section id="game" hidden>

  <div class="bar">
    <span id="progress">1 / 10</span>
    <span id="selectedCount">0人選択中</span>
  </div>

  <div id="cards9" class="cards9"></div>

  <button id="next" class="primary wide">
    次へ
  </button>

</section>

<section id="result" hidden>

  <h2>あなたの好き顔 TOP 9</h2>

  <p class="result-note">
    選んだ回数が多い順です
  </p>

  <div id="ranking"></div>

  <button id="again" class="primary wide">
    もう一度遊ぶ
  </button>

  <p class="source">
    写真・選手情報：
    <a
      href="https://www.boatrace.jp/owpc/pc/data/racersearch/index"
      target="_blank"
      rel="noopener"
    >
      BOAT RACE オフィシャルウェブサイト
    </a>
  </p>

</section>

</main>

<script src="racers.js?v=4"></script>
<script src="app.js?v=4"></script>

</body>
</html>
